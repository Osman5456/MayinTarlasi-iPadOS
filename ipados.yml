name: MayinTarlasi iPadOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipados:
    name: Build unsigned IPA on macOS
    runs-on: macos-15
    steps:
      - name: Checkout game project
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native iPadOS project
        run: xcodegen generate --spec project.yml

      - name: Build app for physical iPad
        run: |
          xcodebuild \
            -project MayinTarlasi.xcodeproj \
            -scheme MayinTarlasi \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/MayinTarlasiBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MayinTarlasiBuild/Build/Products/Release-iphoneos/MayinTarlasi.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/MayinTarlasi.app
          /usr/bin/zip -qry MayinTarlasi-unsigned.ipa Payload
          test -s MayinTarlasi-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayinTarlasi-iPadOS-IPA
          path: MayinTarlasi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
