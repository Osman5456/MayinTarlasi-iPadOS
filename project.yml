name: MayinTarlasi
options:
  bundleIdPrefix: com.mayintarlasi
  deploymentTarget:
    iOS: "15.0"
targets:
  MayinTarlasi:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: MayinTarlasi/Sources
      - path: MayinTarlasi/Web
        type: folder
        buildPhase: resources
      - path: MayinTarlasi/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mayintarlasi.ipad.oyun
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: MayinTarlasi/Info.plist
      properties:
        CFBundleDisplayName: MayinTarlasi
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
